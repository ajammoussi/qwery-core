services:
  tpch-postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tpch-postgres
    environment:
      POSTGRES_DB: tpch
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      SCALE_FACTOR: ${SCALE_FACTOR:-1}
      DATA_DIR: /tmp/tpch_data
      DBNAME: tpch
      PGUSER: ${DB_USER:-postgres}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      # Persist data between container restarts
      - tpch_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d tpch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tpch

volumes:
  tpch_data:
    driver: local

networks:
  tpch:
    driver: bridge
